<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRV Systems — Embedded IoT & 3D Printing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/main.js" defer></script>
</head>

<body class="home-page">
  <main>
    <section class="hero">
      <div class="lang-switch fixed" id="langSwitch">
        <button class="lang-current" type="button" id="langCurrent" aria-haspopup="true" aria-expanded="false">
          <span id="currentLangLabel">UA</span>
          <span class="lang-caret">⌄</span>
        </button>

        <div class="lang-menu" role="menu">
          <button class="lang-item" type="button" data-lang="uk">Українська</button>
          <button class="lang-item" type="button" data-lang="en">English</button>
        </div>
      </div>

      <div class="hero-shell">
        <div class="hero-left">
          <a class="hero-logo" href="./" aria-label="PRV Systems">
            <img src="assets/img/prv_logo.png" alt="PRV Systems Logo" width="320" height="120">
          </a>

          <h1>
            <span data-i18n="heroTitle1">EMBEDDED</span>
            <span data-i18n="heroTitle2">SOLUTIONS</span>
          </h1>

          <p class="subtitle" data-i18n="heroSubtitle">
            Engineering-driven IoT systems. Development reliable hardware & firmware. 3D-Printing & Modeling.
          </p>

          <div class="cta-group">
            <a class="cta secondary" href="about/" data-i18n="aboutBtn">About</a>
            <button class="cta" type="button" id="openContacts" data-i18n="contactBtn">Contact me</button>
          </div>
        </div>

        <div class="hero-right">
          <div class="bg-text">
            IOT<br>
            R&amp;D
          </div>

          <div class="floating-card">
            <img src="assets/img/hero-image.jpg" alt="Engineering" width="760" height="620" fetchpriority="high">
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="contactModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle" data-i18n="modalTitle">Contact me</div>
        <button class="modal-close" type="button" id="closeContacts" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">
        <p class="modal-hint" data-i18n="modalHint">Send a message — it will be delivered to me.</p>

        <form id="contactForm" action="https://formspree.io/f/xgegpvow" method="POST">
          <div class="form-grid">
            <input class="field" type="text" name="name" placeholder="Name" required>
            <input class="field" type="email" name="email" placeholder="Email" required>
            <textarea class="field" name="message" placeholder="Message" required></textarea>
          </div>

          <div class="modal-actions">
            <button class="btn btn-ghost" type="button" id="cancelBtn" data-i18n="cancelBtn">Cancel</button>
            <button class="btn btn-primary" type="submit" data-i18n="sendBtn">Send</button>
          </div>

          <p class="status" id="status"></p>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-content">© 2026 PRV-systems. All rights reserved.</div>
  </footer>
</body>
</html>
